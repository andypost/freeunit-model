name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Run pytest
      run: uv run --python ${{ matrix.python-version }} --with pytest --with hypothesis pytest -v

    - name: Test CLI simulation
      run: uv run --python ${{ matrix.python-version }} python -m unit_model.cli simulate --requests 50 --workers 4

    - name: Test CLI verification
      run: uv run --python ${{ matrix.python-version }} python -m unit_model.cli verify

    - name: Test CLI optimization benchmark
      run: uv run --python ${{ matrix.python-version }} python -m unit_model.cli benchmark-optimizations
