[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freeunit-model"
version = "0.1.0"
description = "Mathematical, discrete-event simulation, and adversarial verification model of FreeUnit (NGINX Unit)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Andy Postnikov", email = "andypost@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
ast = [
    "tree-sitter>=0.22.0",
    "tree-sitter-c>=0.21.0",
]
verify = [
    "hypothesis>=6.80.0",
]
test = [
    "pytest>=7.0.0",
    "hypothesis>=6.80.0",
]
all = [
    "tree-sitter>=0.22.0",
    "tree-sitter-c>=0.21.0",
    "hypothesis>=6.80.0",
    "pytest>=7.0.0",
]

[project.scripts]
unit-model = "unit_model.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unit_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
